name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./lib ./examples/wallet-service/... ./benchmarks/...
      - run: go test -race ./lib ./examples/wallet-service/...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./lib ./examples/wallet-service/... ./benchmarks/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./lib
